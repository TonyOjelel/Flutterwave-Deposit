<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flutterwave Deposit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #F5A623;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #E69512;
        }
        .error {
            color: red;
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Make a Deposit</h1>
    <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>
    </div>
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
    </div>
    <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" required>
    </div>
    <div class="form-group">
        <label for="amount">Amount (UGX):</label>
        <input type="number" id="amount" value="100" required>
    </div>
    <button onclick="makePayment()">Deposit Now</button>
    <div id="error-message" class="error"></div>

    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <script>
        function generateTransactionRef() {
            return 'tx-' + Date.now();
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'block';
            errorDiv.textContent = message;
        }

        function makePayment() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;

            if (!name || !email || !phone || !amount) {
                showError('Please fill in all fields');
                return;
            }

            const config = {
                public_key: "FLWPUBK_TEST-0c1d38c8d8d1c71b39f65d4d2ef5e592-X",
                tx_ref: generateTransactionRef(),
                amount: parseFloat(amount),
                currency: "UGX",
                payment_method: "mobilemoneyuganda",
                country: "UG",
                customer: {
                    email: email,
                    phonenumber: phone,
                    name: name
                },
                customizations: {
                    title: "Deposit Payment",
                    description: "Mobile Money Payment"
                },
                callback: function(response) {
                    if (response.status === "successful") {
                        window.location.href = '/payment-success';
                    } else {
                        showError('Payment failed. Please try again.');
                    }
                },
                onclose: function() {
                    // Handle modal close
                }
            };

            try {
                FlutterwaveCheckout(config);
            } catch (error) {
                showError('Payment initialization failed. Please try again.');
                console.error('Payment error:', error);
            }
        }
    </script>
</body>
</html>
